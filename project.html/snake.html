<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    canvas { background: black; display: block; margin: auto; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">🐍 Nokia Style Snake Game</h2>
  <canvas id="game" width="400" height="400"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const gridSize = 20;
    let snake = [{ x: 200, y: 200 }];
    let direction = { x: 0, y: 0 };
    let food = { x: 100, y: 100 };

    function draw() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "lime";
      snake.forEach(part => ctx.fillRect(part.x, part.y, gridSize, gridSize));

      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, gridSize, gridSize);
    }

    function move() {
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        food.x = Math.floor(Math.random() * 20) * gridSize;
        food.y = Math.floor(Math.random() * 20) * gridSize;
      } else {
        snake.pop();
      }

      if (
        head.x < 0 || head.x >= canvas.width ||
        head.y < 0 || head.y >= canvas.height ||
        snake.slice(1).some(part => part.x === head.x && part.y === head.y)
      ) {
        alert("Game Over!");
        snake = [{ x: 200, y: 200 }];
        direction = { x: 0, y: 0 };
      }
    }

    window.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" && direction.y === 0) direction = { x: 0, y: -gridSize };
      if (e.key === "ArrowDown" && direction.y === 0) direction = { x: 0, y: gridSize };
      if (e.key === "ArrowLeft" && direction.x === 0) direction = { x: -gridSize, y: 0 };
      if (e.key === "ArrowRight" && direction.x === 0) direction = { x: gridSize, y: 0 };
    });

    function gameLoop() {
      move();
      draw();
    }

    setInterval(gameLoop, 150);
  </script>
</body>
</html>
